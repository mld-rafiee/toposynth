# TopoSynth default hyperparameters

data:
  raw_path: data/raw/X_126.csv
  processed_dir: data/processed     # was: processed_path  (train.py reads processed_dir)
  seq_len: 48                       # T: sliding window length (timesteps)
  stride: 1                         # sliding window stride
  n_vnf: 6                          # was: n_vnfc  (train.py reads n_vnf)
  n_features: 12                    # F: features per VNFC
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  num_workers: 4

topology:
  vnfcs: [bono, sprout, homestead, homer, ralf, ellis]
  edges:                            # 14 directed edges — both directions per documented link
    # Each pair modelled as two independent directed channels:
    # traffic volume, timing and packet counts differ by direction.
    # Source: Project Clearwater Architecture documentation.
    # The dataset provides node-level in/out telemetry, NOT per-edge
    # flow records; topology is architecture-derived (see §4 of paper).

    # SIP signaling (Bono is SIP edge proxy; remains on signaling path)
    - [bono, sprout]
    - [sprout, bono]

    # Subscriber authentication / HSS cache (Sprout ↔ Homestead web services)
    - [sprout, homestead]
    - [homestead, sprout]

    # MMTEL service settings (Sprout ↔ Homer XCAP interface)
    - [sprout, homer]
    - [homer, sprout]

    # Charging / billing (Bono and Sprout report billable events to Ralf)
    - [bono, ralf]
    - [ralf, bono]
    - [sprout, ralf]
    - [ralf, sprout]

    # Provisioning (Ellis uses Homer and Homestead-Prov services)
    # Note: 'homestead' here abstracts the Homestead-Prov API endpoint
    - [ellis, homestead]
    - [homestead, ellis]
    - [ellis, homer]
    - [homer, ellis]

gat:
  in_dim: 12                        # F: input node feature dimension
  hidden_dim: 64                    # d_h
  out_dim: 128                      # d_z: topology embedding dimension
  n_heads: 4                        # K: attention heads
  leaky_relu_slope: 0.2
  dropout: 0.1

model:                              # train.py reads cfg["model"]
  n_diff_steps: 200                 # was buried in diffusion.n_steps; unreachable

diffusion:                          # kept for any code that reads diffusion: directly
  n_steps: 200
  schedule: cosine                  # noise schedule: cosine | linear
  seq_len: 48
  d_model: 128                      # Transformer hidden dim
  n_layers: 4                       # Transformer encoder layers
  n_heads: 8                        # Transformer attention heads
  d_ff: 256                         # feedforward dim
  lambda1: 1.0                      # time-domain loss weight
  lambda2: 1.0                      # frequency-domain loss weight
  top_k_freq: 3                     # top-K Fourier components for seasonal

conditioning:                       # kept for reference; values mirrored in training:
  eta: 0.1
  gamma: 0.01

training:
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-6
  n_epochs: 400                      # train.py reads n_epochs
  patience: 40                      # early stopping patience
  checkpoint_dir: checkpoints
  log_dir: logs
  resume: false                     # false = train from scratch with corrected topology;
                                    # set true after retraining to resume from best checkpoint
  lambda_topo: 0.1                  # topology loss weight
  guidance_eta: 0.1                 # was: conditioning.eta
  guidance_gamma: 0.01              # was: conditioning.gamma
  grad_clip: 1.0
  val_every: 5                      # validate every N epochs
  save_every: 10
  device: cuda                      # cuda | cpu
  seed: 42
  experiment_dir: experiments/

evaluation:
  n_synthetic: 500                  # windows to generate (use 5000 for paper run)
  n_infer_steps: 50                 # reverse diffusion steps at inference (< 200 = faster)
  guidance_every: 5                 # apply GAT gradient every K steps (5× speedup)
  tstr_epochs: 50
  granger_lag: 3
  